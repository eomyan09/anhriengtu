<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>🌙 THƯ VIỆN 🌙</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body{margin:0;font-family:'Segoe UI',sans-serif;background:#0b0f19;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-bottom:50px;background-size:cover;background-position:center;background-attachment:fixed;transition:background .3s,color .3s}
        body.dragover::after{content:"📂 Thả file vào đây để tải lên...";position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(99,102,241,.85);color:#fff;font-size:2rem;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(10px);pointer-events:none}
        #lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0f19;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
        .lock-box{background:rgba(17,24,39,.85);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(15px);padding:30px;border-radius:20px;text-align:center;width:90%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
        .lock-input,.input-field{width:100%;padding:12px;margin-bottom:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:1rem;box-sizing:border-box;outline:none;text-align:center}
        .lock-btn,.upload-btn,.capture-btn,.record-cam-btn,.switch-cam-btn,.close-cam-btn{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border:none;padding:12px 20px;border-radius:25px;cursor:pointer;font-weight:600;font-size:1rem}
        .error-msg{color:#e11d48;font-size:.85rem;margin-top:10px;display:none}
        #mainContent{display:none;width:100%;flex-direction:column;align-items:center}
        .settings-toggle-btn{position:fixed;top:15px;left:15px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#cbd5e1;font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000;backdrop-filter:blur(8px)}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);z-index:1001;display:none}
        .custom-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(17,24,39,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:25px;width:90%;max-width:480px;z-index:1002;box-shadow:0 25px 50px rgba(0,0,0,.8);box-sizing:border-box;display:none;max-height:85vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}
        .close-modal-btn{background:none;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer}
        .sub-upload-btn{display:block;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.3);padding:10px;border-radius:10px;text-align:center;cursor:pointer;font-size:.9rem;margin-bottom:10px}
        .bg-thumbnails{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:10px}
        .bg-thumb{width:50px;height:50px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex-shrink:0}
        .bg-thumb.active{border-color:#6366f1}
        .reset-bg-btn{background:transparent;color:#e11d48;border:1px solid rgba(225,29,72,.3);padding:6px;border-radius:8px;font-size:.8rem;cursor:pointer;width:100%;margin-top:5px}
        .theme-options{display:flex;gap:10px}
        .theme-btn{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px;border-radius:8px;cursor:pointer}
        .header{text-align:center;margin:50px 0 20px}
        .card{background:rgba(17,24,39,.7);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);padding:40px;border-radius:20px;width:90%;max-width:550px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5);margin-bottom:20px;box-sizing:border-box}
        .card.transparent-frame{background:rgba(17,24,39,.15)!important;backdrop-filter:blur(5px)!important;border:1px solid rgba(255,255,255,.08)!important}
        .upload-actions-group{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
        .camera-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 14px;border-radius:25px;cursor:pointer;font-weight:600;font-size:.85rem}
        .upload-btn{flex:1;text-align:center;min-width:150px}
        #fileInput{display:none}
        .manage-actions{display:flex;gap:10px;justify-content:center}
        .manage-btn{background:transparent;color:#94a3b8;border:1px solid rgba(255,255,255,.1);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.85rem}
        #cameraModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center}
        #cameraVideo{width:90%;max-width:500px;max-height:70vh;border-radius:15px;background:#000;margin-bottom:15px;object-fit:contain}
        .cam-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .calendar-dropdown{position:absolute;top:45px;right:0;background:rgba(17,24,39,.95);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:18px;width:300px;box-shadow:0 15px 35px rgba(0,0,0,.6);backdrop-filter:blur(15px);z-index:1500;display:none}
        .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:600}
        .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.9rem}
        .cal-weekdays{color:#94a3b8;font-size:.8rem;margin-bottom:8px}
        .cal-day{padding:8px 0;border-radius:8px;cursor:pointer;color:#e2e8f0}
        .cal-day:hover{background:rgba(255,255,255,.15)}
        .cal-day.muted{color:#475569}
        .cal-day.selected{background:#0284c7;color:#fff;font-weight:bold}
        #lightboxModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:3000;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
        .lightbox-wrapper{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
        #lightboxImg,#lightboxVideo{max-width:75vw;max-height:75vh;object-fit:contain;transition:transform .15s;cursor:grab;user-select:none;border-radius:8px}
        .lightbox-controls{position:absolute;top:20px;right:25px;display:flex;gap:12px;z-index:3001}
        .lightbox-btn{background:rgba(255,255,255,.2);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .controls-container{width:90%;max-width:900px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;position:relative}
        .stats-badge{display:flex;gap:12px;background:rgba(17,24,39,.75);border:1px solid rgba(255,255,255,.15);padding:8px 16px;border-radius:20px;backdrop-filter:blur(10px);font-size:.85rem;color:#cbd5e1}
        .stats-badge strong{color:#fff}
        .control-actions-right{display:flex;gap:10px;align-items:center;position:relative}
        .date-input-filter,.calendar-toggle-btn,.sort-select{background:rgba(17,24,39,.85);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:20px;outline:none;font-size:.9rem;backdrop-filter:blur(10px)}
        .date-input-filter{width:115px;text-align:center}
        .calendar-toggle-btn{cursor:pointer}
        .sort-select{cursor:pointer}
        .duplicate-item-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);padding:10px;border-radius:8px;margin-bottom:8px;font-size:.9rem}
        .duplicate-item-row img,.duplicate-item-row video{width:45px;height:45px;object-fit:contain;background:#000;border-radius:4px}
        .month-section{width:90%;max-width:900px;margin-bottom:30px}
        .month-title{font-size:1.15rem;font-weight:600;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:8px;margin-bottom:15px}
        .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:25px;width:100%}
        .memory-item{background:#1a1a1a;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:12px 12px 15px;box-shadow:0 10px 25px rgba(0,0,0,.6);text-align:center;position:relative}
        .memory-item.transparent-card{background:rgba(26,26,26,.2)!important;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)!important}
        .media-container{position:relative;width:100%;height:180px;overflow:hidden;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#000}
        .memory-item img,.memory-item video{width:100%;height:100%;object-fit:contain;border-radius:4px}
        .memory-item audio{width:90%}
        .zoom-icon-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:10}
        .action-btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
        .delete-btn{background-color:#e11d48;color:#fff;border:none;padding:6px 12px;font-size:.75rem;border-radius:20px;cursor:pointer}
        .download-btn{background-color:#0ea5e9;color:#fff;text-decoration:none;padding:6px 12px;font-size:.75rem;border-radius:20px}
        body.light-mode{background-color:#f8fafc;color:#0f172a}
        body.light-mode .card{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.1)}
        body.light-mode .memory-item{background:#fff;border-color:rgba(0,0,0,.1)}
        body.light-mode .custom-modal,body.light-mode .calendar-dropdown{background:rgba(255,255,255,.95);color:#0f172a}
        body.light-mode .stats-badge,body.light-mode .date-input-filter,body.light-mode .calendar-toggle-btn,body.light-mode .sort-select,body.light-mode .settings-toggle-btn{background:rgba(0,0,0,.05);color:#475569;border-color:rgba(0,0,0,.15)}
    </style>
</head>
<body>
    <div id="lockScreen">
        <div class="lock-box">
            <h2>🔒 KHO BẢO MẬT</h2>
            <input type="password" id="passInput" class="lock-input" placeholder="Nhập mật khẩu...">
            <button class="lock-btn" onclick="checkPassword()">Mở khóa</button>
            <div id="errorMsg" class="error-msg">❌ Mật khẩu không chính xác!</div>
        </div>
    </div>

    <div id="cameraModal">
        <video id="cameraVideo" autoplay playsinline></video>
        <div class="cam-controls">
            <button class="capture-btn" id="capturePhotoBtn" onclick="takeSnapshot()">📸 Chụp</button>
            <button class="record-cam-btn" id="recordVideoBtn" onclick="toggleCamVideoRecording()">⏺️ Quay</button>
            <button class="switch-cam-btn" onclick="switchCamera()">🔄 Đổi cam</button>
            <button class="close-cam-btn" onclick="closeCamera()">Đóng</button>
        </div>
    </div>

    <div id="duplicateModal" class="custom-modal">
        <div class="modal-header"><h3>🧹 Quản lý tệp lặp</h3><button class="close-modal-btn" onclick="closeAllModals()">✕</button></div>
        <div id="duplicateListContainer"><p style="text-align:center;color:#94a3b8">Đang quét...</p></div>
        <div style="margin-top:15px;text-align:right"><button class="lock-btn" onclick="closeAllModals()" style="width:auto;padding:8px 20px">Đóng</button></div>
    </div>

    <div id="lightboxModal">
        <div class="lightbox-controls">
            <button class="lightbox-btn" onclick="rotateMedia()">🔄</button>
            <button class="lightbox-btn" onclick="closeLightbox()">✕</button>
        </div>
        <div class="lightbox-wrapper" id="lightboxWrapper">
            <img id="lightboxImg" style="display:none">
            <video id="lightboxVideo" controls style="display:none"></video>
        </div>
    </div>

    <div id="mainContent">
        <button class="settings-toggle-btn" onclick="toggleModal('settingsModal')">☰</button>
        <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

        <div id="settingsModal" class="custom-modal">
            <div class="modal-header"><h3>⚙️ Cài đặt</h3><button class="close-modal-btn" onclick="closeAllModals()">✕</button></div>
            <div class="settings-section">
                <h4>1. Đổi ảnh nền</h4>
                <label for="bgFileInput" class="sub-upload-btn">+ Tải ảnh nền</label>
                <input type="file" id="bgFileInput" accept="image/*" style="display:none">
                <div id="presetBgThumbnails" class="bg-thumbnails"></div>
                <div id="bgThumbnails" class="bg-thumbnails"></div>
                <div style="margin-top:12px;font-size:.85rem"><input type="checkbox" id="transparentFrameCheck" onchange="toggleTransparentFrame(this)"> <label for="transparentFrameCheck">Khung thẻ trong suốt</label></div>
                <div style="margin-top:8px;font-size:.85rem"><input type="checkbox" id="syncBgCheck" onchange="toggleSyncBg(this)"> <label for="syncBgCheck">Đồng bộ nền chung</label></div>
                <button class="reset-bg-btn" onclick="resetBackground()">Khôi phục mặc định</button>
            </div>
            <div class="settings-section">
                <h4>2. Giao diện</h4>
                <div class="theme-options">
                    <button class="theme-btn" onclick="setTheme('light')">☀️ Sáng</button>
                    <button class="theme-btn" onclick="setTheme('dark')">🌙 Tối</button>
                    <button class="theme-btn" onclick="setTheme('system')">💻 Hệ thống</button>
                </div>
            </div>
        </div>

        <div class="header"><h1>🌙 THƯ VIỆN 🌙</h1><p>Những tấm ảnh riêng tư :))</p></div>

        <div class="card" id="dropZoneCard">
            <h2>✨ Thêm kỷ niệm ✨</h2>
            <input type="text" class="input-field" id="memoryName" placeholder="Tên chung (tùy chọn)...">
            <div class="upload-actions-group">
                <button class="camera-btn" onclick="openCamera()">📷 Camera</button>
                <button class="camera-btn" id="recordBtn" onclick="toggleRecording()">🎤 Ghi âm</button>
                <label for="fileInput" class="upload-btn lock-btn" style="display:inline-block">📂 Chọn file</label>
            </div>
            <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.heic,.heif" multiple>
            <div class="manage-actions">
                <button class="manage-btn" onclick="loadGallery(true)">Quản lý kho</button>
                <button class="manage-btn" onclick="openDuplicateModal()">🧹 Tìm tệp lặp</button>
            </div>
        </div>

        <div class="controls-container">
            <div class="stats-badge">
                <span>🖼️ Ảnh: <strong id="imgCount">0</strong></span>
                <span>🎬 Video: <strong id="videoCount">0</strong></span>
                <span>🎤 Âm thanh: <strong id="audioCount">0</strong></span>
            </div>
            <div class="control-actions-right">
                <input type="text" id="dateInputFilter" class="date-input-filter" placeholder="DD/MM/YYYY" maxlength="10" oninput="handleManualDateInput(this)">
                <div style="position:relative">
                    <button class="calendar-toggle-btn" onclick="toggleCalendarDropdown()">📅</button>
                    <div id="calendarDropdown" class="calendar-dropdown">
                        <div class="cal-header">
                            <button class="calendar-toggle-btn" onclick="changeCalendarMonth(-1)">‹</button>
                            <span id="calMonthYearTitle"></span>
                            <div style="display:flex;gap:4px">
                                <button class="calendar-toggle-btn" onclick="changeCalendarMonth(1)">›</button>
                                <button class="calendar-toggle-btn" onclick="clearDateFilter()">↺</button>
                            </div>
                        </div>
                        <div class="cal-grid cal-weekdays"><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div></div>
                        <div id="calDaysGrid" class="cal-grid"></div>
                    </div>
                </div>
                <select id="sortSelect" class="sort-select" onchange="loadGallery(false)">
                    <option value="desc">Mới nhất</option><option value="asc">Cũ nhất</option>
                </select>
            </div>
        </div>
        <div id="galleryContainer" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
    </div>

    <script>
        const MY_PASSWORD = "2009";
        function checkPassword() {
            if (document.getElementById('passInput').value === MY_PASSWORD) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                sessionStorage.setItem('anhriengtu_Unlocked', 'true');
                fetchAndApplyBackground(); applyTransparentFrameSetting(); loadGallery(false);
            } else { document.getElementById('errorMsg').style.display = 'block'; }
        }
        document.getElementById('passInput').addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('anhriengtu_Unlocked') === 'true') {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                fetchAndApplyBackground(); applyTransparentFrameSetting(); setTheme(localStorage.getItem('anhriengtu_Theme') || 'dark'); loadGallery(false);
            }
        });

        firebase.initializeApp({
            apiKey: "AIzaSyBe82TCKrsTNrWyRopuHHgAEWDRmiWed5o", authDomain: "anhriengtu-98bce.firebaseapp.com",
            projectId: "anhriengtu-98bce", storageBucket: "anhriengtu-98bce.firebasestorage.app",
            messagingSenderId: "293881146251", appId: "1:293881146251:web:62306e755b25d0aaa45d8e"
        });
        const db = firebase.firestore();
        let myUserId = localStorage.getItem('anhriengtu_UserId') || (() => {
            let id = 'user_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('anhriengtu_UserId', id); return id;
        })();

        const presetBackgrounds = [
            "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1426604966848-d7adac902bff?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1511497584788-876761197069?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1538342416801-70bf81e05a8b?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1510784722466-f2aa9c52fff6?q=80&w=1000&auto=format&fit=crop"
        ];

        function toggleModal(id) {
            closeAllModals();
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
            if (id === 'settingsModal') {
                renderThumbnails('bgThumbnails', JSON.parse(localStorage.getItem('anhriengtu_Backgrounds')) || []);
                renderThumbnails('presetBgThumbnails', presetBackgrounds);
                document.getElementById('syncBgCheck').checked = (localStorage.getItem('anhriengtu_SyncBg') === 'true');
                document.getElementById('transparentFrameCheck').checked = (localStorage.getItem('anhriengtu_TransparentFrame') === 'true');
            }
        }
        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            ['settingsModal', 'duplicateModal', 'calendarDropdown'].forEach(id => document.getElementById(id).style.display = 'none');
        }

        async function applyBackground(url, isGlobal = false) {
            if (url) {
                document.body.style.backgroundImage = `linear-gradient(rgba(11,15,25,.75),rgba(11,15,25,.75)),url('${url}')`;
                if (isGlobal) {
                    localStorage.setItem('anhriengtu_SyncBg', 'true'); localStorage.setItem('anhriengtu_GlobalBg', url); localStorage.removeItem('anhriengtu_SelectedBg');
                    try { await db.collection('settings').doc('globalConfig').set({ globalBgUrl: url }, { merge: true }); } catch (e) {}
                } else {
                    localStorage.setItem('anhriengtu_SelectedBg', url); localStorage.removeItem('anhriengtu_GlobalBg');
                }
            } else {
                document.body.style.backgroundImage = 'none'; localStorage.removeItem('anhriengtu_SelectedBg'); localStorage.removeItem('anhriengtu_GlobalBg');
                try { await db.collection('settings').doc('globalConfig').set({ globalBgUrl: '' }, { merge: true }); } catch (e) {}
            }
        }
        async function fetchAndApplyBackground() {
            if (localStorage.getItem('anhriengtu_SyncBg') === 'true') {
                try {
                    let doc = await db.collection('settings').doc('globalConfig').get();
                    if (doc.exists && doc.data().globalBgUrl) { applyBackground(doc.data().globalBgUrl, true); return; }
                } catch (e) {}
            }
            let local = localStorage.getItem('anhriengtu_SelectedBg'); if (local) applyBackground(local);
        }
        function toggleSyncBg(cb) {
            localStorage.setItem('anhriengtu_SyncBg', cb.checked ? 'true' : 'false');
            let cur = localStorage.getItem('anhriengtu_SelectedBg') || localStorage.getItem('anhriengtu_GlobalBg');
            if (cur) applyBackground(cur, cb.checked);
        }
        function resetBackground() { applyBackground(null, localStorage.getItem('anhriengtu_SyncBg') === 'true'); }

        document.getElementById('bgFileInput').addEventListener('change', function() {
            let file = this.files[0]; if (!file) return;
            let reader = new FileReader();
            reader.onload = e => {
                let list = JSON.parse(localStorage.getItem('anhriengtu_Backgrounds')) || [];
                if (!list.includes(e.target.result)) { list.unshift(e.target.result); if(list.length>10)list.pop(); localStorage.setItem('anhriengtu_Backgrounds', JSON.stringify(list)); }
                applyBackground(e.target.result, localStorage.getItem('anhriengtu_SyncBg') === 'true');
                renderThumbnails('bgThumbnails', list); this.value = '';
            };
            reader.readAsDataURL(file);
        });
        function renderThumbnails(containerId, list) {
            let container = document.getElementById(containerId); if (!container) return;
            let cur = localStorage.getItem('anhriengtu_SelectedBg') || localStorage.getItem('anhriengtu_GlobalBg');
            container.innerHTML = list.length === 0 ? '<span style="font-size:.75rem;color:#94a3b8">Trống</span>' : '';
            list.forEach(url => {
                let img = document.createElement('img'); img.src = url; img.className = 'bg-thumb' + (url === cur ? ' active' : '');
                img.onclick = () => applyBackground(url, localStorage.getItem('anhriengtu_SyncBg') === 'true');
                container.appendChild(img);
            });
        }

        function setTheme(mode) {
            localStorage.setItem('anhriengtu_Theme', mode);
            document.body.classList.toggle('light-mode', mode === 'light' || (mode === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches));
        }
        function toggleTransparentFrame(cb) {
            localStorage.setItem('anhriengtu_TransparentFrame', cb.checked ? 'true' : 'false'); applyTransparentFrameSetting();
        }
        function applyTransparentFrameSetting() {
            let isTrans = localStorage.getItem('anhriengtu_TransparentFrame') === 'true';
            document.getElementById('dropZoneCard').classList.toggle('transparent-frame', isTrans);
            document.querySelectorAll('.memory-item').forEach(el => el.classList.toggle('transparent-card', isTrans));
        }

        let mediaStream = null, currentFacingMode = 'user', camRec = null, camChunks = [], isCamRec = false;
        async function openCamera() {
            document.getElementById('cameraModal').style.display = 'flex';
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
                document.getElementById('cameraVideo').srcObject = mediaStream;
            } catch (e) { alert('Lỗi Camera/Mic!'); closeCamera(); }
        }
        async function switchCamera() { currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; await openCamera(); }
        function closeCamera() {
            if (isCamRec && camRec) camRec.stop();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            document.getElementById('cameraModal').style.display = 'none'; isCamRec = false;
        }
        async function takeSnapshot() {
            let v = document.getElementById('cameraVideo'), canvas = document.createElement('canvas');
            canvas.width = v.videoWidth || 640; canvas.height = v.videoHeight || 480;
            let ctx = canvas.getContext('2d');
            if (currentFacingMode === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async b => { closeCamera(); await handleFiles([new File([b], `cam_${Date.now()}.jpg`, { type: 'image/jpeg' })]); }, 'image/jpeg', 0.9);
        }
        function toggleCamVideoRecording() {
            let btn = document.getElementById('recordVideoBtn');
            if (!isCamRec) {
                camChunks = [];
                try { camRec = new MediaRecorder(mediaStream, { mimeType: 'video/webm' }); } catch(e) { camRec = new MediaRecorder(mediaStream); }
                camRec.ondataavailable = e => { if (e.data.size > 0) camChunks.push(e.data); };
                camRec.onstop = async () => {
                    let file = new File([new Blob(camChunks, { type: 'video/webm' })], `cam_vid_${Date.now()}.webm`, { type: 'video/webm' });
                    closeCamera(); await handleFiles([file]);
                };
                camRec.start(); isCamRec = true; btn.style.background = '#e11d48'; btn.textContent = '⏹️ Dừng';
            } else { camRec.stop(); }
        }

        let mediaRec, audioChunks = [], isRec = false;
        async function toggleRecording() {
            let btn = document.getElementById('recordBtn');
            if (!isRec) {
                try {
                    let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRec = new MediaRecorder(stream); audioChunks = [];
                    mediaRec.ondataavailable = e => audioChunks.push(e.data);
                    mediaRec.onstop = async () => {
                        let file = new File([new Blob(audioChunks, { type: 'audio/webm' })], `audio_${Date.now()}.webm`, { type: 'audio/webm' });
                        await handleFiles([file]); stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRec.start(); isRec = true; btn.style.background = '#e11d48'; btn.textContent = '⏹️ Dừng';
                } catch(e) { alert('Không thể ghi âm!'); }
            } else { mediaRec.stop(); isRec = false; btn.style.background = ''; btn.textContent = '🎤 Ghi âm'; }
        }

        let scale = 1, rotation = 0, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0, activeEl = null;
        function openLightbox(url, type = 'image') {
            scale = 1; rotation = 0; pointX = 0; pointY = 0;
            let img = document.getElementById('lightboxImg'), vid = document.getElementById('lightboxVideo');
            if (type === 'video') { img.style.display = 'none'; vid.style.display = 'block'; vid.src = url; activeEl = vid; }
            else { vid.style.display = 'none'; vid.pause(); img.style.display = 'block'; img.src = url; activeEl = img; }
            setTransform(); document.getElementById('lightboxModal').style.display = 'flex';
        }
        function closeLightbox() { document.getElementById('lightboxVideo').pause(); document.getElementById('lightboxModal').style.display = 'none'; }
        function rotateMedia() { rotation = (rotation + 90) % 360; setTransform(); }
        function setTransform() { if (activeEl) activeEl.style.transform = `translate(${pointX}px,${pointY}px) scale(${scale}) rotate(${rotation}deg)`; }
        
        let wrap = document.getElementById('lightboxWrapper');
        wrap.addEventListener('mousedown', e => { if(e.target.tagName==='BUTTON'||e.target.tagName==='VIDEO') return; panning = true; startX = e.clientX - pointX; startY = e.clientY - pointY; });
        window.addEventListener('mousemove', e => { if (!panning) return; pointX = e.clientX - startX; pointY = e.clientY - startY; setTransform(); });
        window.addEventListener('mouseup', () => panning = false);
        wrap.addEventListener('wheel', e => {
            e.preventDefault(); let xs = (e.clientX - pointX) / scale, ys = (e.clientY - pointY) / scale;
            scale = Math.max(0.5, Math.min(e.deltaY < 0 ? scale * 1.1 : scale / 1.1, 5));
            pointX = e.clientX - xs * scale; pointY = e.clientY - ys * scale; setTransform();
        });

        ['dragenter', 'dragover'].forEach(eName => window.addEventListener(eName, e => { e.preventDefault(); document.body.classList.add('dragover'); }));
        ['dragleave', 'drop'].forEach(eName => window.addEventListener(eName, e => { e.preventDefault(); document.body.classList.remove('dragover'); }));
        window.addEventListener('drop', async e => { e.preventDefault(); if (e.dataTransfer.files.length) await handleFiles(Array.from(e.dataTransfer.files)); });
        document.getElementById('fileInput').addEventListener('change', function() { if (this.files.length) { handleFiles(Array.from(this.files)); this.value = ''; } });

        async function handleFiles(files) {
            let baseName = document.getElementById('memoryName').value.trim() || "Kỷ niệm", success = 0;
            alert(`Đang tải lên ${files.length} file...`);
            for (let i = 0; i < files.length; i++) {
                let file = files[i]; if (!file.size) continue;
                let fd = new FormData(); fd.append('file', file); fd.append('upload_preset', 'idontknow');
                try {
                    let res = await fetch(`https://api.cloudinary.com/v1_1/egzgqmsa/${file.type.startsWith('video')||file.name.endsWith('.webm')?'video':'image'}/upload`, { method: 'POST', body: fd });
                    let data = await res.json(); if (!data.secure_url) continue;
                    let fDate = file.lastModified ? new Date(file.lastModified) : new Date();
                    await db.collection('memories').add({
                        name: files.length > 1 ? `${baseName} (${i + 1})` : baseName,
                        originalFileName: file.name, fileSize: file.size, url: data.secure_url,
                        type: file.type.startsWith('video') || file.name.endsWith('.webm') ? 'video' : (file.type.startsWith('audio') ? 'audio' : 'image'),
                        date: fDate.toLocaleDateString('vi-VN'), uploaderId: myUserId, createdAt: firebase.firestore.Timestamp.fromDate(fDate)
                    });
                    success++;
                } catch(e) {}
            }
            alert(`Thành công ${success}/${files.length} file!`); document.getElementById('memoryName').value = ''; loadGallery(true);
        }

        async function openDuplicateModal() {
            toggleModal('duplicateModal'); let container = document.getElementById('duplicateListContainer');
            container.innerHTML = '<p style="text-align:center;color:#94a3b8">Đang quét...</p>';
            try {
                let snap = await db.collection('memories').get(), map = {};
                snap.forEach(doc => { let d = doc.data(), k = `${d.originalFileName||d.name}_${d.fileSize||0}`; if(!map[k]) map[k]=[]; map[k].push({id:doc.id, ...d}); });
                let dups = Object.values(map.filter ? Object.values(map) : []).filter(g => g.length > 1);
                if (dups.length === 0) { container.innerHTML = '<p style="text-align:center;color:#10b981;padding:20px">✨ Không có tệp trùng!</p>'; return; }
                container.innerHTML = '';
                dups.forEach((g, idx) => {
                    let div = document.createElement('div'); div.style.marginBottom = '15px';
                    div.innerHTML = `<div style="font-size:.85rem;color:#94a3b8;margin-bottom:5px">Nhóm #${idx+1}:</div>`;
                    g.forEach((item, i) => {
                        div.innerHTML += `<div class="duplicate-item-row"><div style="display:flex;align-items:center;gap:10px">${item.type==='video'?`<video src="${item.url}"></video>`:`<img src="${item.url}">`}<div><strong>${item.name}</strong><br><span style="font-size:.75rem;color:#94a3b8">${item.date}</span></div></div><div>${i===0?'<span style="color:#10b981;font-size:.8rem">(Gốc)</span>':`<button class="delete-btn" onclick="deleteDup('${item.id}')">Xóa</button>`}</div></div>`;
                    });
                    container.appendChild(div);
                });
            } catch(e) { container.innerHTML = '<p style="text-align:center;color:#e11d48">Lỗi quét!</p>'; }
        }
        async function deleteDup(id) { if (confirm('Xóa bản lặp này?')) { await db.collection('memories').doc(id).delete(); openDuplicateModal(); } }

        let calDate = new Date(), filterDate = null;
        function toggleCalendarDropdown() { let d = document.getElementById('calendarDropdown'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; if(d.style.display==='block') renderCalendar(); }
        function changeCalendarMonth(dir) { calDate.setMonth(calDate.getMonth() + dir); renderCalendar(); }
        const monthsVi = ["Tháng Một","Tháng Hai","Tháng Ba","Tháng Tư","Tháng Năm","Tháng Sáu","Tháng Bảy","Tháng Tám","Tháng Chín","Tháng Mười","Tháng Mười Một","Tháng Chạp"];
        function renderCalendar() {
            let y = calDate.getFullYear(), m = calDate.getMonth();
            document.getElementById('calMonthYearTitle').textContent = `${monthsVi[m]} ${y}`;
            let grid = document.getElementById('calDaysGrid'); grid.innerHTML = '';
            let firstDay = (new Date(y, m, 1).getDay() + 6) % 7, totalDays = new Date(y, m + 1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
            for (let i = firstDay - 1; i >= 0; i--) { let d = document.createElement('div'); d.className = 'cal-day muted'; d.textContent = prevDays - i; grid.appendChild(d); }
            for (let i = 1; i <= totalDays; i++) {
                let d = document.createElement('div'); d.className = 'cal-day'; d.textContent = i;
                let fDate = `${i<10?'0'+i:i}/${m+1<10?'0'+(m+1):m+1}/${y}`;
                if (filterDate === fDate) d.classList.add('selected');
                d.onclick = () => { filterDate = fDate; document.getElementById('dateInputFilter').value = fDate; document.getElementById('calendarDropdown').style.display = 'none'; loadGallery(false); };
                grid.appendChild(d);
            }
        }
        function handleManualDateInput(input) {
            let val = input.value.trim();
            if (val.length === 2 && !val.includes('/')) input.value = val + '/';
            else if (val.length === 5 && val.split('/').length === 2) input.value = val + '/';
            filterDate = /^(\d{2})\/(\d{2})\/(\d{4})$/.test(val) ? val : null;
            if (val === '') filterDate = null;
            loadGallery(false);
        }
        function clearDateFilter() { filterDate = null; document.getElementById('dateInputFilter').value = ''; document.getElementById('calendarDropdown').style.display = 'none'; loadGallery(false); }

        function loadGallery(scroll = false) {
            let gallery = document.getElementById('galleryContainer'), sortOrder = document.getElementById('sortSelect').value;
            gallery.innerHTML = '<p style="text-align:center;color:#94a3b8;margin-top:20px">Đang đồng bộ...</p>';
            db.collection('memories').onSnapshot(snap => {
                gallery.innerHTML = ''; let imgC = 0, vidC = 0, audC = 0, items = [];
                if (snap.empty) { document.getElementById('imgCount').textContent=0; document.getElementById('videoCount').textContent=0; document.getElementById('audioCount').textContent=0; gallery.innerHTML='<p style="text-align:center;color:#94a3b8;margin-top:20px">Chưa có kỷ niệm nào...</p>'; return; }
                snap.forEach(doc => {
                    let d = doc.data(); if (filterDate && d.date !== filterDate) return;
                    items.push({ id: doc.id, ...d });
                    if (d.type === 'video') vidC++; else if (d.type === 'audio') audC++; else imgC++;
                });
                document.getElementById('imgCount').textContent = imgC; document.getElementById('videoCount').textContent = vidC; document.getElementById('audioCount').textContent = audC;
                if (!items.length) { gallery.innerHTML = '<p style="text-align:center;color:#94a3b8;margin-top:20px">Không tìm thấy file phù hợp.</p>'; return; }
                items.sort((a, b) => (sortOrder === 'desc' ? (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0) : (a.createdAt?.toMillis()||0) - (b.createdAt?.toMillis()||0)));
                
                let grouped = {}, keys = [];
                items.forEach(item => {
                    let dt = item.createdAt ? item.createdAt.toDate() : new Date(), key = `Tháng ${dt.getMonth()+1} năm ${dt.getFullYear()}`;
                    if (!grouped[key]) { grouped[key] = []; keys.push(key); }
                    grouped[key].push(item);
                });
                if (sortOrder === 'asc') keys.reverse();
                let isTrans = localStorage.getItem('anhriengtu_TransparentFrame') === 'true';

                keys.forEach(k => {
                    let sec = document.createElement('div'); sec.className = 'month-section';
                    sec.innerHTML = `<div class="month-title">📅 ${k}</div>`;
                    let grid = document.createElement('div'); grid.className = 'gallery-grid';
                    grouped[k].forEach(item => {
                        let media = item.type === 'video' ? `<div class="media-container"><video src="${item.url}" preload="metadata"></video><button class="zoom-icon-btn" onclick="openLightbox('${item.url}','video')">🔍</button></div>` :
                                      item.type === 'audio' ? `<div class="media-container"><audio src="${item.url}" controls></audio></div>` :
                                      `<div class="media-container"><img src="${item.url}" alt="${item.name}"><button class="zoom-icon-btn" onclick="openLightbox('${item.url}','image')">🔍</button></div>`;
                        grid.innerHTML += `<div class="memory-item ${isTrans?'transparent-card':''}">${media}<p>${item.name}</p><span>${item.date||''}</span><div class="action-btns"><button onclick="downloadMedia('${item.url}','${item.name}')" class="download-btn">Tải</button>${item.uploaderId===myUserId?`<button class="delete-btn" onclick="deleteMemory('${item.id}')">Xóa</button>`:''}</div></div>`;
                    });
                    sec.appendChild(grid); gallery.appendChild(sec);
                });
                if (scroll) gallery.scrollIntoView({ behavior: 'smooth' });
            });
        }

        async function downloadMedia(url, name) {
            try {
                let res = await fetch(url), blob = await res.blob(), bUrl = window.URL.createObjectURL(blob);
                let a = document.createElement('a'); a.href = bUrl; a.download = name || 'download';
                document.body.appendChild(a); a.click(); document.body.removeChild(a); window.URL.revokeObjectURL(bUrl);
            } catch(e) { window.open(url, '_blank'); }
        }
        async function deleteMemory(id) { if (confirm('Xóa file này?')) await db.collection('memories').doc(id).delete(); }
    </script>
</body>
</html>
